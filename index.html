<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture Player</title>
<!--
  Lecture Player - the lecture on YouTube beside the course book, the book's
  page turning with the lecture.

  Reads two files the handbook build writes into <course>/Course book/:
      <name> - Course book.pdf             the text edition
      <name> - Course book.timeline.json   page -> second of the video it starts at
  Open through serve.py (YouTube refuses to play inside a page opened as a file).
-->
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --ink: #1d2733; --muted: #66727f;
    --line: #dde3e9; --accent: #1f7a78; --accent-ink: #ffffff; --hover: #eaf3f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171c; --panel: #1b2229; --ink: #e3e8ee; --muted: #8e9aa6;
      --line: #2c353f; --accent: #3aa8a4; --accent-ink: #0d1316; --hover: #22303a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.4 system-ui, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  header .title { color: var(--muted); flex: 1; min-width: 0;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button, .filebtn {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  button:hover, .filebtn:hover { background: var(--hover); }
  button.primary, .filebtn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  label.check { display: inline-flex; align-items: center; gap: 5px; user-select: none; }
  input[type=number] { width: 64px; font: inherit; color: var(--ink); background: var(--panel);
                       border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }

  /* ---- start screen: pick the book, then the lecture */
  #start { flex: 1; overflow: auto; padding: 24px 16px; }
  .card { max-width: 760px; margin: 0 auto; background: var(--panel);
          border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  .card h2 { margin: 0 0 6px; font-size: 18px; }
  .card p { margin: 0 0 14px; color: var(--muted); }
  #drop { border: 2px dashed var(--line); border-radius: 8px; padding: 18px; text-align: center; }
  #drop.over { border-color: var(--accent); background: var(--hover); }
  #msg { margin-top: 10px; color: #c0392b; white-space: pre-line; }
  #chapters { list-style: none; padding: 0; margin: 16px 0 0; }
  #chapters li { display: flex; gap: 10px; align-items: baseline; padding: 9px 10px;
                 border-radius: 6px; cursor: pointer; }
  #chapters li:hover { background: var(--hover); }
  #chapters .n { color: var(--muted); width: 26px; text-align: right; flex: none; }
  #chapters .t { flex: 1; }
  #chapters .meta { color: var(--muted); font-size: 12px; flex: none; }

  /* ---- the split view */
  #view { flex: 1; display: none; min-height: 0; }
  #view.on { display: flex; }
  #left { flex: 1 1 50%; display: flex; flex-direction: column; min-width: 0; background: #000; }
  #yt { flex: 1; width: 100%; }
  #right { flex: 1 1 50%; display: flex; flex-direction: column; min-width: 0;
           border-left: 1px solid var(--line); }
  #pagebar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
             padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #pagebar .spacer { flex: 1; }
  #pagebar .status { color: var(--muted); font-size: 12px; }
  /* block + auto margins, not flex centring: a page zoomed wider than the box
     must still scroll to its left edge */
  #pagebox { flex: 1; overflow: auto; padding: 10px; min-height: 0; }
  #canvas { display: block; margin: 0 auto; box-shadow: 0 1px 6px rgba(0,0,0,.25); background: #fff; }
  #zoomPct { min-width: 44px; text-align: center; color: var(--muted); font-size: 12px; }
  #divider { flex: 0 0 6px; cursor: col-resize; background: var(--line); }
  #divider:hover, #divider.drag { background: var(--accent); }
  /* while dragging, the YouTube frame would swallow the mouse */
  #view.dragging iframe { pointer-events: none; }
  #view.dragging { user-select: none; cursor: col-resize; }
  @media (max-width: 800px) {
    #view.on { flex-direction: column; }
    #left { flex: 0 0 auto !important; aspect-ratio: 16 / 9; }
    #divider { display: none; }
    #right { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Lecture Player</h1>
  <span class="title" id="hdr"></span>
  <button id="btnIndex" hidden>Contents</button>
</header>

<section id="start">
  <div class="card">
    <h2>Open a course book</h2>
    <p>Choose the course book - the PDF named <code>… - Course book.pdf</code>.</p>
    <div id="drop">
      <label class="filebtn primary">Choose the book…
        <input id="files" type="file" accept=".pdf,.json,application/pdf" multiple hidden>
      </label>
      <div style="margin-top:8px;color:var(--muted)">or drop it here</div>
    </div>
    <div id="msg"></div>
    <div id="fileWarn" hidden style="margin-top:12px;padding:10px 12px;border-radius:6px;
         background:#fdecea;color:#8a1f11">
      <b>The video will not play</b> - this page was opened straight from disk, and
      YouTube refuses that (its "Error 153"). Close this tab and start the player with:
      <pre style="margin:6px 0 0">python handbook/player/serve.py</pre>
    </div>
    <ul id="chapters"></ul>
  </div>
</section>

<section id="view">
  <div id="left"><div id="yt"></div></div>
  <div id="divider" title="Drag to give the book or the video more room"></div>
  <div id="right">
    <div id="pagebar">
      <button id="prev" title="Previous page (←)">◀</button>
      <input id="pageNum" type="number" min="1">
      <span id="pageOf"></span>
      <button id="next" title="Next page (→)">▶</button>
      <label class="check" title="Turn the page as the lecture goes on">
        <input id="follow" type="checkbox" checked> Follow video</label>
      <button id="sync" title="Show the page the video is on now">Sync to video</button>
      <button id="zoomOut" title="Smaller (Ctrl + wheel)">−</button>
      <span id="zoomPct"></span>
      <button id="zoomIn" title="Larger (Ctrl + wheel)">+</button>
      <button id="zoomFit" title="Page as wide as this side">Fit width</button>
      <span class="spacer"></span>
      <span class="status" id="status"></span>
    </div>
    <div id="pagebox"><canvas id="canvas"></canvas></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = id => document.getElementById(id);
if (location.protocol === "file:") $("fileWarn").hidden = false;
const state = {
  pdf: null, timeline: null,
  chapter: null,          // the chapter whose lecture is playing
  page: 1,                // the book page on screen
  player: null, playerReady: false, videoId: null,
  rendering: false, pendingPage: null,
};

// ------------------------------------------------------------ loading the book
$("files").addEventListener("change", e => openFiles([...e.target.files]));
const drop = $("drop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("over");
  openFiles([...e.dataTransfer.files]);
});

async function openFiles(files) {
  $("msg").textContent = "";
  const pdfFile = files.find(f => f.name.toLowerCase().endsWith(".pdf"));
  const tlFile = files.find(f => f.name.toLowerCase().endsWith(".timeline.json"));
  if (!pdfFile) {
    $("msg").textContent = "Choose the course book's PDF.";
    return;
  }
  // a timeline from another book would turn the wrong pages without any error
  if (tlFile && tlFile.name.replace(/\.timeline\.json$/i, "") !== pdfFile.name.replace(/\.pdf$/i, "")) {
    $("msg").textContent = "These two files are not from the same book:\n"
      + pdfFile.name + "\n" + tlFile.name;
    return;
  }
  try {
    state.pdf = await pdfjsLib.getDocument({ data: await pdfFile.arrayBuffer() }).promise;
    // The book carries its own timeline as an attachment; a separate
    // .timeline.json (books built before that) is still accepted.
    if (tlFile) {
      state.timeline = JSON.parse(await tlFile.text());
    } else {
      const att = (await state.pdf.getAttachments() || {})["timeline.json"];
      if (!att) {
        $("msg").textContent = "This PDF has no lecture timeline inside it - it is not a "
          + "course book, or it was built before the player existed. Choose its "
          + ".timeline.json together with it.";
        return;
      }
      state.timeline = JSON.parse(new TextDecoder("utf-8").decode(att.content));
    }
  } catch (err) {
    $("msg").textContent = "Could not open the book: " + err;
    return;
  }
  if (state.pdf.numPages !== state.timeline.total_pages) {
    $("msg").textContent = `Warning: the PDF has ${state.pdf.numPages} pages, the timeline says `
      + `${state.timeline.total_pages}. Was the book rebuilt without its timeline?`;
  }
  for (const ch of state.timeline.chapters) {
    ch.pages.sort((a, b) => a.page - b.page);
  }
  $("hdr").textContent = pdfFile.name.replace(/\.pdf$/i, "");
  showIndex();
}

function showIndex() {
  const ul = $("chapters");
  ul.innerHTML = "";
  for (const ch of state.timeline.chapters) {
    const li = document.createElement("li");
    const last = ch.pages.length ? ch.pages[ch.pages.length - 1].start_sec : 0;
    li.innerHTML = `<span class="n">${ch.chapter}.</span>
      <span class="t"></span>
      <span class="meta">p. ${ch.first_page}–${ch.last_page} · ${fmt(last)}${ch.video_url ? "" : " · no video"}</span>`;
    li.querySelector(".t").textContent = ch.title + (ch.lecturer ? " — " + ch.lecturer : "");
    li.addEventListener("click", () => openChapter(ch));
    ul.appendChild(li);
  }
  $("start").style.display = "";
  $("view").classList.remove("on");
  $("btnIndex").hidden = true;
  if (state.player && state.playerReady) state.player.pauseVideo();
}
$("btnIndex").addEventListener("click", showIndex);

// ------------------------------------------------------------ chapters and pages
function chapterOfPage(p) {
  return state.timeline.chapters.find(c => p >= c.first_page && p <= c.last_page) || null;
}

// The page the lecture is on at second t: the last page that starts at or
// before t. Before the first timed page it is the chapter's own first page.
function pageAt(ch, t) {
  let page = ch.first_page;
  for (const p of ch.pages) {
    if (p.start_sec <= t) page = p.page; else break;
  }
  return page;
}

function startOf(ch, page) {
  const p = ch.pages.find(x => x.page === page);
  return p ? p.start_sec : null;
}

function openChapter(ch, page) {
  state.chapter = ch;
  $("start").style.display = "none";
  $("view").classList.add("on");
  $("btnIndex").hidden = false;
  $("hdr").textContent = `${ch.chapter}. ${ch.title}`;
  const first = page || (ch.pages.length ? ch.pages[0].page : ch.first_page);
  showPage(first);
  loadVideo(ch, startOf(ch, first) || 0);
}

// Moving through the book by hand takes the lecture with it: the video goes to
// the second the new page starts at (a page without a time - a cover, an index -
// leaves the video where it is).
function goToPage(p, fromUser) {
  p = Math.max(1, Math.min(state.pdf.numPages, p));
  const ch = chapterOfPage(p);
  if (ch && ch !== state.chapter) {
    openChapter(ch, p);
    return;
  }
  showPage(p);
  if (fromUser && ch) {
    const s = startOf(ch, p);
    if (s !== null && state.playerReady) state.player.seekTo(s, true);
  }
}

$("prev").addEventListener("click", () => goToPage(state.page - 1, true));
$("next").addEventListener("click", () => goToPage(state.page + 1, true));
$("pageNum").addEventListener("change", e => goToPage(parseInt(e.target.value, 10) || 1, true));
$("sync").addEventListener("click", () => followTick(true));
document.addEventListener("keydown", e => {
  if (!$("view").classList.contains("on") || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") { goToPage(state.page - 1, true); e.preventDefault(); }
  if (e.key === "ArrowRight") { goToPage(state.page + 1, true); e.preventDefault(); }
});

// ------------------------------------------------------------ drawing a page
async function showPage(p) {
  state.page = p;
  $("pageNum").value = p;
  $("pageOf").textContent = "/ " + state.pdf.numPages;
  $("prev").disabled = p <= 1;
  $("next").disabled = p >= state.pdf.numPages;
  const s = state.chapter && startOf(state.chapter, p);
  $("status").textContent = (s !== null && s !== undefined) ? "starts at " + fmt(s) : "";
  // one render at a time; the newest request wins
  if (state.rendering) { state.pendingPage = p; return; }
  state.rendering = true;
  try {
    const page = await state.pdf.getPage(p);
    const box = $("pagebox");
    const base = page.getViewport({ scale: 1 });
    // as wide as this side, times the reader's zoom; taller than the box scrolls
    const fit = (box.clientWidth - 20) / base.width;
    const scale = Math.max(0.3, fit * zoom);
    const dpr = window.devicePixelRatio || 1;
    const vp = page.getViewport({ scale: scale * dpr });
    const c = $("canvas");
    c.width = vp.width; c.height = vp.height;
    c.style.width = (vp.width / dpr) + "px"; c.style.height = (vp.height / dpr) + "px";
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    if (p !== state.drawnPage) box.scrollTop = 0;     // a new page starts at its top
    state.drawnPage = p;
  } finally {
    state.rendering = false;
    if (state.pendingPage !== null) {
      // the same page too: a zoom or a resize asked for it again while drawing
      const next = state.pendingPage; state.pendingPage = null;
      showPage(next);
    }
  }
}
let resizeTimer;
function redraw() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => state.pdf && $("view").classList.contains("on") && showPage(state.page), 150);
}
window.addEventListener("resize", redraw);

// ------------------------------------------------------------ zoom and the divider
// Both are remembered for next time - in this browser only, and the player
// works the same when the browser keeps nothing.
function remember(key, value) { try { localStorage.setItem(key, String(value)); } catch {} }
function recall(key) { try { return localStorage.getItem(key); } catch { return null; } }

let zoom = parseFloat(recall("player.zoom")) || 1;
function setZoom(z) {
  zoom = Math.max(0.5, Math.min(4, Math.round(z * 100) / 100));
  $("zoomPct").textContent = Math.round(zoom * 100) + "%";
  remember("player.zoom", zoom);
  redraw();
}
setZoom(zoom);
$("zoomIn").addEventListener("click", () => setZoom(zoom * 1.15));
$("zoomOut").addEventListener("click", () => setZoom(zoom / 1.15));
$("zoomFit").addEventListener("click", () => setZoom(1));
$("pagebox").addEventListener("wheel", e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  setZoom(zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
}, { passive: false });

function setSplit(pct) {
  pct = Math.max(20, Math.min(80, pct));
  $("left").style.flex = `0 0 ${pct}%`;
  $("right").style.flex = "1 1 0";
  return pct;
}
const savedSplit = parseFloat(recall("player.split"));
if (savedSplit) setSplit(savedSplit);
$("divider").addEventListener("pointerdown", e => {
  e.preventDefault();
  const view = $("view"), div = $("divider");
  view.classList.add("dragging"); div.classList.add("drag");
  div.setPointerCapture(e.pointerId);
  const move = ev => {
    const r = view.getBoundingClientRect();
    remember("player.split", setSplit((ev.clientX - r.left) / r.width * 100));
  };
  const up = () => {
    view.classList.remove("dragging"); div.classList.remove("drag");
    div.removeEventListener("pointermove", move);
    div.removeEventListener("pointerup", up);
    redraw();
  };
  div.addEventListener("pointermove", move);
  div.addEventListener("pointerup", up);
});

// ------------------------------------------------------------ the video
function videoIdOf(url) {
  if (!url) return null;
  try {
    const u = new URL(url);
    if (u.hostname.includes("youtu.be")) return u.pathname.slice(1);
    return u.searchParams.get("v");
  } catch { return null; }
}

function loadVideo(ch, start) {
  const id = videoIdOf(ch.video_url);
  if (!id) {
    $("status").textContent = "This lecture has no video link.";
    return;
  }
  if (!window.YT || !YT.Player) {           // the API is still loading
    state.waiting = () => loadVideo(ch, start);
    return;
  }
  if (!state.player) {
    state.player = new YT.Player("yt", {
      videoId: id, playerVars: { start: Math.floor(start), rel: 0 },
      events: { onReady: () => { state.playerReady = true; } },
    });
  } else if (state.playerReady) {
    if (state.videoId === id) state.player.seekTo(start, true);
    else state.player.loadVideoById({ videoId: id, startSeconds: start });
  }
  state.videoId = id;
}

window.onYouTubeIframeAPIReady = () => { if (state.waiting) { state.waiting(); state.waiting = null; } };
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

// Twice a second: the page the lecture is on, if following.
function followTick(force) {
  if (!state.playerReady || !state.chapter || !$("view").classList.contains("on")) return;
  if (!force && !$("follow").checked) return;
  const playing = state.player.getPlayerState() === YT.PlayerState.PLAYING;
  if (!force && !playing) return;
  const want = pageAt(state.chapter, state.player.getCurrentTime());
  if (want !== state.page) showPage(want);
}
setInterval(followTick, 500);

function fmt(s) {
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
}
</script>
</body>
</html>
